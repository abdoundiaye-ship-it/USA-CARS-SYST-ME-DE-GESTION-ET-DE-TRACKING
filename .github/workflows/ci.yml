# Intégration continue — aucun secret de production n’est utilisé ici (CLAUDE.md §2).
# La base de données des tests est un Supabase LOCAL démarré sur le runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualite:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  base-et-parcours:
    name: Base locale (pgTAP) et parcours (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer Supabase local
        run: pnpm exec supabase start
      - name: Réinitialiser la base locale (migrations + seed fictif)
        run: pnpm db:reset
      - name: Tests de base de données (RLS, pgTAP)
        run: pnpm test:db
      - name: Écrire .env.local (clés locales)
        run: pnpm db:env
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cloudflare:
    name: Build Cloudflare (OpenNext) et essai dans workerd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pour Cloudflare Workers (valeurs factices, aucun secret)
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice
        run: pnpm cf:build
      - name: Démarrer l’application dans le moteur Cloudflare local (workerd)
        run: |
          # .dev.vars remplace les « vars » de production de wrangler.jsonc : aucune requête vers la production.
          printf 'NEXT_PUBLIC_APP_ENV=local\nNEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\nNEXT_PUBLIC_SUPABASE_ANON_KEY=cle-factice\nAPP_URL=http://localhost:8787\nSUPABASE_SERVICE_ROLE_KEY=cle-factice\n' > .dev.vars
          pnpm exec wrangler dev --port 8787 --var NEXT_PUBLIC_APP_ENV:local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8787/connexion && break; sleep 2; done
      - name: Vérifier la page de connexion et la redirection du proxy
        run: |
          set -e
          curl -s http://localhost:8787/connexion | grep -q "Connexion"
          headers=$(curl -s -o /dev/null -D - http://localhost:8787/parametres)
          echo "$headers" | grep -E "^HTTP/.* 30[37]"
          echo "$headers" | grep -i "^location: .*/connexion?suite=%2Fparametres"
      - if: failure()
        run: cat wrangler.log || true

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Analyse de tout l’historique avec la CLI : l’action gitleaks calcule une plage `premier_commit^..`
      # qui échoue quand le push contient le tout premier commit du dépôt.
      - name: Analyser l’historique (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v --no-banner
