# Restauration d'une sauvegarde nocturne dans un NOUVEAU projet Supabase vide (décision G3-a, docs/21_sauvegardes.md).
# Lancement manuel uniquement. Le script refuse le projet de production. Secrets du projet cible à créer avant :
# RESTAURATION_DB_URL, RESTAURATION_SUPABASE_URL, RESTAURATION_SERVICE_ROLE_KEY (et SAUVEGARDE_PHRASE).
name: Restauration

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Numéro de l'exécution « Sauvegarde » (dans l'adresse de la page de l'exécution)
        required: true
      archive:
        description: Nom de l'artefact (ex. sauvegarde-2026-10-23-0200)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  restauration:
    name: Restauration dans le projet cible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.archive }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Restaurer et vérifier les comptages
        env:
          SUPABASE_DB_URL: ${{ secrets.RESTAURATION_DB_URL }}
          SUPABASE_URL: ${{ secrets.RESTAURATION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RESTAURATION_SERVICE_ROLE_KEY }}
          SAUVEGARDE_PHRASE: ${{ secrets.SAUVEGARDE_PHRASE }}
        run: bash scripts/restauration.sh "$RUNNER_TEMP/${{ inputs.archive }}.tar.gz.gpg"
